name: Deploy To Ubuntu

on:
  pull_request:
    branches:
      - master
    types:
      - closed

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: self-hosted

    steps:
      - name: Checkout Master
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check Java Version
        run: |
          java -version
          javac -version

      - name: Build Application
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Stop Old Application
        run: |
          APP_DIR="/home/spring-demo/githubActionDemo"

          if [ -f "$APP_DIR/app.pid" ]; then
            PID=$(cat "$APP_DIR/app.pid")

            if [[ "$PID" =~ ^[0-9]+$ ]] && [ "$PID" -gt 1 ] && kill -0 "$PID" 2>/dev/null; then
              kill "$PID"

              for i in {1..10}; do
                if ! kill -0 "$PID" 2>/dev/null; then
                  break
                fi
                sleep 1
              done

              if kill -0 "$PID" 2>/dev/null; then
                echo "ERROR: Old application did not stop"
                exit 1
              fi
            fi

            rm -f "$APP_DIR/app.pid"
          fi

      - name: Copy New Application
        run: |
          APP_DIR="/home/spring-demo/githubActionDemo"

          mkdir -p "$APP_DIR"
          cp target/app.jar "$APP_DIR/app.jar"

      - name: Start Application
        run: |
          cd /home/spring-demo/githubActionDemo

          RUNNER_TRACKING_ID="" nohup java -jar app.jar > app.log 2>&1 &

          echo $! > app.pid

      - name: Verify Deployment
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8080/hello; then
              echo "Deployment successful!"
              exit 0
            fi
            sleep 1
          done

          echo "ERROR: Application failed to start"
          cat /home/spring-demo/githubActionDemo/app.log
          exit 1