name: Deploy To Ubuntu

on:
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: self-hosted

    steps:
      - name: Checkout Main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check Java Version
        run: |
          java -version
          javac -version

      - name: Build Application
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Stop Old Application
        run: |
          APP_DIR="/home/spring-demo/githubActionDemo"
          PID_FILE="$APP_DIR/app.pid"

          if [ -f "$PID_FILE" ]; then
            PID=$(cat "$PID_FILE")

            if [[ "$PID" =~ ^[0-9]+$ ]] &&
               [ "$PID" -gt 1 ] &&
               [ -r "/proc/$PID/cmdline" ]; then

              CMD=$(tr '\0' ' ' < "/proc/$PID/cmdline")

              if [[ "$CMD" == *"app.jar"* ]] &&
                 [[ "$CMD" == *"--server.port=8081"* ]]; then
                kill "$PID"

                for i in {1..10}; do
                  if ! kill -0 "$PID" 2>/dev/null; then
                    break
                  fi
                  sleep 1
                done

                if kill -0 "$PID" 2>/dev/null; then
                  echo "ERROR: Old application did not stop"
                  exit 1
                fi
              else
                echo "PID file does not identify our port 8081 application."
              fi
            fi

            rm -f "$PID_FILE"
          fi

      - name: Copy New Application
        run: |
          APP_DIR="/home/spring-demo/githubActionDemo"

          JAR_FILE=$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*original*' | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "ERROR: No application JAR found in target/"
            exit 1
          fi

          mkdir -p "$APP_DIR"
          cp "$JAR_FILE" "$APP_DIR/app.jar"

      - name: Start Application
        run: |
          cd /home/spring-demo/githubActionDemo

          RUNNER_TRACKING_ID="" nohup java -jar app.jar --server.port=8081 > app.log 2>&1 &

          echo $! > app.pid

      - name: Verify Deployment
        run: |
          APP_DIR="/home/spring-demo/githubActionDemo"

          for i in {1..30}; do
            if curl --fail --silent http://localhost:8081/hello; then
              echo "Deployment successful!"
              exit 0
            fi

            sleep 1
          done

          echo "ERROR: Application failed to start"
          cat "$APP_DIR/app.log"
          exit 1