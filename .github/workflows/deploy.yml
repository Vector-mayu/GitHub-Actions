```yaml
name: Deploy To Ubuntu

on:
  pull_request:
    branches:
      - master
    types:
      - closed

jobs:
  deploy:
    if: github.event.pull_request.merged == true

    runs-on: self-hosted

    steps:
      - name: Checkout Master
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check Java Version
        run: |
          java -version
          javac -version

      - name: Build Application
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Stop Old Application
        run: |
          APP_DIR="/home/spring-demo/githubActionDemo"

          if [ -f "$APP_DIR/app.pid" ]; then
            PID=$(cat "$APP_DIR/app.pid")

            if kill -0 "$PID" 2>/dev/null; then
              kill "$PID"
              sleep 2
            fi

            rm -f "$APP_DIR/app.pid"
          fi

      - name: Copy New Application
        run: |
          APP_DIR="/home/spring-demo/githubActionDemo"

          mkdir -p "$APP_DIR"
          cp target/app.jar "$APP_DIR/app.jar"

      - name: Start Application
        run: |
          cd /home/spring-demo/githubActionDemo

          RUNNER_TRACKING_ID="" nohup java -jar app.jar > app.log 2>&1 &

          echo $! > app.pid

      - name: Verify Deployment
        run: |
          sleep 5
          curl --fail http://localhost:8080/hello
```
